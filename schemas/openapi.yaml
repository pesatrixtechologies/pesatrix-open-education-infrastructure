components:
  schemas:
    AttendanceRecordResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        school_id:
          type: string
          format: uuid
          title: School Id
        student_identity_id:
          type: string
          format: uuid
          title: Student Identity Id
        date:
          type: string
          format: date
          title: Date
        status:
          $ref: '#/components/schemas/AttendanceStatus'
        source_event_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Source Event Id
        derived_at:
          type: string
          format: date-time
          title: Derived At
      type: object
      required:
      - id
      - school_id
      - student_identity_id
      - date
      - status
      - derived_at
      title: AttendanceRecordResponse
    AttendanceStatus:
      type: string
      enum:
      - present
      - late
      - absent
      - excused
