name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check, test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oe
          POSTGRES_PASSWORD: oe
          POSTGRES_DB: oe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oe -d oe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OE_TEST_DATABASE_URL: postgresql+asyncpg://oe:oe@127.0.0.1:5432/oe_test
      OE_DATABASE_URL: postgresql+asyncpg://oe:oe@127.0.0.1:5432/oe_test
      OE_SECRET_KEY: ci-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
      OE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest --cov=oe_infrastructure --cov-report=term-missing

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Bandit (static analysis)
        run: bandit -q -r src -ll
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit --skip-editable
