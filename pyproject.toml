[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pesatrix-open-education-infrastructure"
version = "0.1.0"
description = "Open-source digital infrastructure for managing structured educational events, student identity references, QR-based credentials, attendance, and offline synchronization in low-resource environments."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "PESATRIX TECHNOLOGIES SARL", email = "opensource@pesatrix.com" },
]
keywords = [
    "education",
    "edtech",
    "identity",
    "credentials",
    "qr",
    "attendance",
    "offline-sync",
    "open-source",
    "low-resource",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Non-Profit Organizations",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "PyJWT[crypto]>=2.8,<3.0",
    "cryptography>=42.0,<45.0",
    "bcrypt>=4.0,<6.0",
    "python-multipart>=0.0.9,<1.0",
    "qrcode[pil]>=7.4,<9.0",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pip-audit>=2.7",
    "bandit>=1.7",
]

[project.scripts]
oe-infra = "oe_infrastructure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oe_infrastructure = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.coverage.run]
source = ["oe_infrastructure"]
omit = ["*/tests/*"]